name: Parknic
options:
  bundleIdPrefix: com.seongmo
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Parknic:
    type: application
    platform: iOS
    sources:
      - path: Parknic
        excludes:
          - "**/README.md"
    entitlements:
      path: Parknic/App/Parknic.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: Parknic/App/Info.plist
      properties:
        APIBaseURL: $(API_BASE_URL)
        TermsURL: $(TERMS_URL)
        PrivacyPolicyURL: $(PRIVACY_POLICY_URL)
        NSLocationWhenInUseUsageDescription: 공원 안에 머무는 시간을 재려고 체크인하는 동안 현재 위치를 사용해요.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - location
        UIAppFonts:
          - Pretendard-Regular.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
          - Pretendard-ExtraBold.otf
          - Jua-Regular.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seongmo.parknic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 파크닉
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        # 서버 주소는 빌드 설정으로 구분한다. Release 주소는 서버 운영 주소가 정해지면 교체한다.
        API_BASE_URL: http://localhost:8080
        # 약관·개인정보 처리방침 주소. 심사 제출 전에 실제 주소로 바꾼다(임시값).
        TERMS_URL: https:/$()/parknic.example/terms
        PRIVACY_POLICY_URL: https:/$()/parknic.example/privacy
        # Xcode가 문구 카탈로그를 자동으로 고치지 않게 한다(문구는 직접 관리).
        SWIFT_EMIT_LOC_STRINGS: NO
      configs:
        Release:
          API_BASE_URL: https://api.parknic.example
  ParknicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParknicTests
    dependencies:
      - target: Parknic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seongmo.parknic.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Parknic:
    build:
      targets:
        Parknic: all
    test:
      targets:
        - ParknicTests
