name: Parknic
options:
  bundleIdPrefix: com.hwangsanghwan
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM은 Config/Shared.xcconfig(공유 기본값)와 Config/Signing.xcconfig(개인, Git 제외)에서 정한다.
targets:
  Parknic:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: Parknic
        excludes:
          - "**/README.md"
    info:
      path: Parknic/App/Info.plist
      properties:
        # 버전·빌드 번호는 빌드 설정(MARKETING_VERSION / CURRENT_PROJECT_VERSION)에서 온다. fastlane release가 덮어쓴다.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        APIBaseURL: $(API_BASE_URL)
        TermsURL: $(TERMS_URL)
        PrivacyPolicyURL: $(PRIVACY_POLICY_URL)
        # Debug 개발용 값(Release에서는 코드가 읽지 않는다). 홈 화면에서 직접 실행해도 적용되도록 빌드 설정에 둔다.
        DevUseRemoteAPI: $(DEV_USE_REMOTE_API)
        DevLoginSecret: $(DEV_LOGIN_SECRET)
        DevLoginName: $(DEV_LOGIN_NAME)
        DevCheckInRequiredSeconds: $(DEV_CHECKIN_REQUIRED_SECONDS)
        # 시험용 TestFlight 빌드에서만 채운다(fastlane `quick_checkin:true`). 비어 있으면 20분이며, App Store 제출 빌드는 반드시 비운다.
        CheckInRequiredSecondsOverride: $(CHECKIN_REQUIRED_SECONDS_OVERRIDE)
        NSLocationWhenInUseUsageDescription: 공원 안에 머무는 시간을 재려고 체크인하는 동안 현재 위치를 사용해요.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # HTTPS 표준 암호화만 쓰므로 수출 규정 질문에 "아니오"로 답한다(업로드마다 묻지 않게).
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - location
        UIAppFonts:
          - Pretendard-Regular.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
          - Pretendard-ExtraBold.otf
          - Jua-Regular.ttf
    settings:
      base:
        # PRODUCT_BUNDLE_IDENTIFIER는 Config/Shared.xcconfig(기본 com.hwangsanghwan.parknic)에서 정한다.
        # CODE_SIGN_ENTITLEMENTS(Sign in with Apple 권한 파일)는 Config/Shared.xcconfig에서 정한다. 파일은 직접 관리한다.
        # 서명 인증서는 xcconfig(Config/Signing.xcconfig)가 정하게 둔다. XcodeGen 기본값 "iPhone Developer"가 덮어쓰지 않게 한다.
        CODE_SIGN_IDENTITY: $(inherited)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 파크닉
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        # 서버 주소는 빌드 설정으로 구분한다. Release 주소는 서버 운영 주소가 정해지면 교체한다.
        API_BASE_URL: http://localhost:8080
        DEV_USE_REMOTE_API: "NO"
        DEV_CHECKIN_REQUIRED_SECONDS: ""
        CHECKIN_REQUIRED_SECONDS_OVERRIDE: ""
        # 약관·개인정보 처리방침 주소. 심사 제출 전에 실제 주소로 바꾼다(임시값).
        TERMS_URL: https:/$()/parknic-dev.duckdns.org/terms
        PRIVACY_POLICY_URL: https:/$()/parknic-dev.duckdns.org/privacy
        # Xcode가 문구 카탈로그를 자동으로 고치지 않게 한다(문구는 직접 관리).
        SWIFT_EMIT_LOC_STRINGS: NO
      configs:
        Debug:
          # Debug는 배포 서버에 붙는다(개발용 로그인은 Config/Local.xcconfig의 DEV_LOGIN_SECRET이 필요하다).
          # 맥에서 도는 로컬 서버에 붙으려면 아래를 http://Seongmo-MacBookPro-M4.local:8080 으로 바꾼다(맥 이름은 `scutil --get LocalHostName`).
          API_BASE_URL: https://parknic-dev.duckdns.org
          # Mock으로만 돌리려면 NO로 바꾼다(스킴 환경변수 PARKNIC_USE_REMOTE_API=0도 같은 효과).
          DEV_USE_REMOTE_API: "YES"
          # 체크인 완료까지 걸리는 시간(초). 서버 로컬 설정(1분)보다 조금 길게. 실제 20분으로 시험하려면 빈 값으로.
          DEV_CHECKIN_REQUIRED_SECONDS: "65"
        Release:
          API_BASE_URL: https://parknic-dev.duckdns.org
  ParknicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParknicTests
    dependencies:
      - target: Parknic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hwangsanghwan.parknic.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Parknic:
    build:
      targets:
        Parknic: all
    test:
      targets:
        - ParknicTests
      # 실행 스킴의 환경변수를 물려받지 않게 테스트는 실제 값(20분)으로 고정한다.
      environmentVariables:
        PARKNIC_CHECKIN_REQUIRED_SECONDS: "1200"
