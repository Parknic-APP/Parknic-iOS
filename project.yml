name: Parknic
options:
  bundleIdPrefix: com.seongmo
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Parknic:
    type: application
    platform: iOS
    sources:
      - path: Parknic
        excludes:
          - "**/README.md"
    entitlements:
      path: Parknic/App/Parknic.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: Parknic/App/Info.plist
      properties:
        APIBaseURL: $(API_BASE_URL)
        TermsURL: $(TERMS_URL)
        PrivacyPolicyURL: $(PRIVACY_POLICY_URL)
        NSLocationWhenInUseUsageDescription: 공원 안에 머무는 시간을 재려고 체크인하는 동안 현재 위치를 사용해요.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # HTTPS 표준 암호화만 쓰므로 수출 규정 질문에 "아니오"로 답한다(업로드마다 묻지 않게).
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - location
        UIAppFonts:
          - Pretendard-Regular.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
          - Pretendard-ExtraBold.otf
          - Jua-Regular.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seongmo.parknic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 파크닉
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        # 서버 주소는 빌드 설정으로 구분한다. Release 주소는 서버 운영 주소가 정해지면 교체한다.
        API_BASE_URL: http://localhost:8080
        # 약관·개인정보 처리방침 주소. 심사 제출 전에 실제 주소로 바꾼다(임시값).
        TERMS_URL: https:/$()/parknic.example/terms
        PRIVACY_POLICY_URL: https:/$()/parknic.example/privacy
        # Xcode가 문구 카탈로그를 자동으로 고치지 않게 한다(문구는 직접 관리).
        SWIFT_EMIT_LOC_STRINGS: NO
      configs:
        Release:
          API_BASE_URL: https://api.parknic.example
  ParknicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParknicTests
    dependencies:
      - target: Parknic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seongmo.parknic.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Parknic:
    build:
      targets:
        Parknic: all
    run:
      environmentVariables:
        # Debug에서 Mock 대신 로컬 서버(API_BASE_URL)를 쓴다. Mock으로 돌리려면 이 값을 0으로 바꾼다.
        PARKNIC_USE_REMOTE_API: "1"
        # 체크인 완료까지 걸리는 시간(초). 서버 로컬 설정(1분)보다 조금 길게 둔다. 실제 20분으로 시험하려면 이 줄을 지운다.
        PARKNIC_CHECKIN_REQUIRED_SECONDS: "65"
    test:
      targets:
        - ParknicTests
      # 실행 스킴의 환경변수를 물려받지 않게 테스트는 실제 값(20분)으로 고정한다.
      environmentVariables:
        PARKNIC_CHECKIN_REQUIRED_SECONDS: "1200"
